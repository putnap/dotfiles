id = "agent-footer-preview"
name = "Agent footer preview"
version = "0.1.0"
min_herdr_version = "0.9.0"
platforms = ["macos"]

[[startup]]
command = ["bash", "collect.sh"]

[[actions]]
id = "collect"
title = "Start footer collector"
contexts = ["global"]
command = ["bash", "collect.sh"]

[[panes]]
id = "claude"
title = "Claude"
placement = "tab"
command = ["claude", "--dangerously-skip-permissions", "--settings", '{"statusLine":{"type":"command","command":"bash \"$HERDR_PLUGIN_ROOT/claude-cache.sh\""}}']

[[panes]]
id = "codex"
title = "Codex"
placement = "tab"
command = ["codex", "-c", "tui.status_line=[]"]
