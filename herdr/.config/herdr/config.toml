onboarding = false
# Keybindings mirror ~/.config/tmux/tmux.conf so muscle memory carries over.
# Validate after editing: herdr config check   Apply live: prefix+r

[theme]
name = "catppuccin"

# Catppuccin's default selection_bg (#313244) sits too close to sidebar_bg
# (#181825) to read as a highlight. Cursor row and focused row stay two steps apart.
auto_switch = false
[theme.custom]
selection_bg = "#45475a"
active_row_bg = "#292a3d"

[keys]
prefix = "ctrl+\\"

# tmux `bind r source-file`. resize_mode moves off prefix+r to make room.
reload_config = ["prefix+shift+r", "prefix+r"]
resize_mode = "prefix+ctrl+r"

# tmux defaults that herdr puts elsewhere. Both bindings stay live.
rename_tab = ["prefix+shift+t", "prefix+,"]
rename_workspace = ["prefix+shift+w", "prefix+$"]
close_tab = ["prefix+shift+x", "prefix+&"]
# prefix+{ and prefix+} are tmux's order-based swaps, in smart-splits below; herdr's swaps are
# directional, so side-by-side panes never swapped up or down.
swap_pane_up = "prefix+shift+k"
swap_pane_down = "prefix+shift+j"
last_pane = "prefix+;"
cycle_pane_next = ["prefix+tab", "prefix+o"]

# tmux detaches on prefix+d and shows pane numbers on prefix+q; leaving detach
# on prefix+q would detach on a keystroke that is harmless in tmux.
detach = "prefix+d"

# prefix+o and prefix+s go to the tmux meanings above, so herdr's own actions move.
# open_notification_target only fires while an in-app toast is visible, and
# ui.toast.delivery = "off" means there never is one; attention.jump below
# is the keyboard equivalent that actually works.
open_notification_target = "prefix+shift+o"
settings = "prefix+ctrl+s"
# Agents create worktrees with plain `git worktree add`, so herdr never opens
# them. open_worktree lists every checkout git knows about, opened or not --
# that is how an agent's worktree gets adopted (and picks up the layout hook).
# Built-in open_worktree is only offered on a parent Git workspace row, so it
# does nothing from inside a worktree. worktree.open below works from either.
open_worktree = ""
# Not prefix+ctrl+shift+g: that is one shift key from open_worktree above, too
# close for something that deletes a checkout. herdr confirms either way.
remove_worktree = "prefix+alt+g"
# Superseded by the prompted popup below, which also asks for base and path.
new_worktree = ""

# tmux windows -> herdr tabs. alt+shift+h/l were dropped: Aerospace binds them
# globally and always won. ctrl+tab was tried and never arrives either -- the
# terminal does not deliver it -- so shift+arrows stays the gesture.
previous_tab = ["prefix+p", "shift+left"]
next_tab = ["prefix+n", "shift+right"]

# prefix+x, tmux's kill-pane, is the worktree plugin's close below. The direct chord is for
# closing repeatedly; ctrl+w stays delete-word, which zsh, Claude Code and lazygit all rely on.
close_pane = "ctrl+shift+w"
toggle_sidebar = "ctrl+shift+d"

# Shift+arrows are the tmux window-switching muscle memory. Horizontal keeps
# meaning "tab" (they sit in a horizontal bar); vertical walks the sidebar's
# tree, every agent and each space or worktree without one, then the inbox
# (sidebar.next and sidebar.previous in [[keys.command]] below).

# Walk the agent panel, which the sidebar plugin makes the inbox of pinned, blocked
# and done agents: ctrl+hjkl moves between panes, ctrl+shift+j/k between agents.
next_agent = "ctrl+shift+j"
previous_agent = "ctrl+shift+k"

# ctrl+shift+\ and ctrl+shift+- are the shared chords: Zen and the terminal
# never receive the same keystroke, so the same action gets the same keys in
# both. prefix+v, prefix+| and prefix+minus stay for the tmux muscle memory.
split_vertical = ["ctrl+shift+\\"]
split_horizontal = ["ctrl+shift+-"]

# tmux `bind C-o` / `bind s` -> the sesh picker (see [[keys.command]] below).
# prefix+w keeps herdr's own workspace picker.

# goto (herdr's navigate mode) defaults to prefix+g, which is lazygit's below.
goto = ""

# g is git: prefix+ctrl+g new worktree, prefix+g lazygit here.
[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
width = "80%"
height = "80%"
description = "Lazygit"

[[keys.command]]
key = "prefix+h"
type = "popup"
command = "gh-dash"
width = "80%"
height = "80%"
description = "GitHub Dashboard"

[[keys.command]]
key = ["prefix+s", "prefix+ctrl+o"]
type = "plugin_action"
command = "sessionizer.open"
description = "workspace picker"

# Worktrees. Our popup also asks for a base ref; herdr's built-in dialog asks
# only for a branch, so it keeps a key of its own rather than being shadowed.
[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktree.new"
description = "new git worktree (prompted)"

[[keys.command]]
key = "prefix+ctrl+g"
type = "plugin_action"
command = "worktree.open"
description = "open an existing git worktree"

# ctrl+shift+= gives this pane its own tab -- the same chord and the same idea
# as Zen's unsplit, which gives a tab back its own window. \ and - divide,
# = undivides.
[[keys.command]]
key = "ctrl+shift+="
type = "shell"
command = "~/.config/herdr/scripts/break-pane.sh tab" # the script also takes `workspace`
description = "move this pane into its own tab"

# tmux `bind f` / `bind F` -> agent-fork.
[[keys.command]]
key = "prefix+f"
type = "shell"
command = "~/.config/herdr/scripts/agent-fork.sh pane"
description = "fork agent into a pane"

[[keys.command]]
key = "prefix+shift+f"
type = "shell"
command = "~/.config/herdr/scripts/agent-fork.sh tab"
description = "fork agent into a tab"

# tmux `bind C` -> a tab that starts as claude, not as a shell running claude.
# ctrl+shift+c is the pane version: bare ctrl+shift+* is the pane-scope family
# here (split, close_pane, break-pane), so the chord says which one you get.
[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "agents.new-tab"
description = "new tab with the default agent"

[[keys.command]]
key = "ctrl+shift+c"
type = "plugin_action"
command = "agents.new-pane"
description = "new pane with the default agent"

# prefix+< sits beside tmux's prefix+, for the tab, and renames the agent's session, which
# the pane's title follows.
[[keys.command]]
key = "prefix+<"
type = "plugin_action"
command = "agents.rename"
description = "rename the Claude session (empty: Claude names it)"

# smart-splits (local plugin): ctrl+hjkl navigates nvim splits and herdr panes as
# one surface. Resize moved to ctrl+shift+arrows so plain ctrl+arrows can be word
# motion in every app -- see KEYBINDINGS.md.

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "smart-splits.nav-left"
description = "navigate left (nvim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "smart-splits.nav-down"
description = "navigate down (nvim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "smart-splits.nav-up"
description = "navigate up (nvim/herdr)"

# tmux's prefix+m marks a pane; here it pins the focused agent to the top of the inbox.
[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "sidebar.pin"
description = "pin the agent to the top of the inbox"

[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "sidebar.acknowledge"
description = "mark the agent's reply read"

[[keys.command]]
key = "shift+down"
type = "plugin_action"
command = "sidebar.next"
description = "next space, worktree or agent in the sidebar"

[[keys.command]]
key = "shift+up"
type = "plugin_action"
command = "sidebar.previous"
description = "previous space, worktree or agent in the sidebar"

# i for the focused agent's pull request, the one looked at most, shift for its Linear issue;
# prefix+shift+p is herdr's rename_pane.
[[keys.command]]
key = "prefix+i"
type = "plugin_action"
command = "sidebar.open-pull-request"
description = "open the agent's pull request"

[[keys.command]]
key = "prefix+shift+i"
type = "plugin_action"
command = "sidebar.open-issue"
description = "open the agent's Linear issue"

[[keys.command]]
key = "prefix+{"
type = "plugin_action"
command = "smart-splits.swap-previous"
description = "swap with the previous pane (tmux)"

[[keys.command]]
key = "prefix+}"
type = "plugin_action"
command = "smart-splits.swap-next"
description = "swap with the next pane (tmux)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "smart-splits.nav-right"
description = "navigate right (nvim/herdr)"

[[keys.command]]
key = "ctrl+shift+left"
type = "plugin_action"
command = "smart-splits.resize-left"
description = "resize left (nvim/herdr)"

[[keys.command]]
key = "ctrl+shift+down"
type = "plugin_action"
command = "smart-splits.resize-down"
description = "resize down (nvim/herdr)"

[[keys.command]]
key = "ctrl+shift+up"
type = "plugin_action"
command = "smart-splits.resize-up"
description = "resize up (nvim/herdr)"

[[keys.command]]
key = "ctrl+shift+right"
type = "plugin_action"
command = "smart-splits.resize-right"
description = "resize right (nvim/herdr)"

[ui]
show_agent_labels_on_pane_borders = true
# Room for an agent's task title under a worktree; the default 26 cuts most of them off.
sidebar_width = 60
sidebar_max_width = 60
agent_panel_sort = "spaces"
tab_bar_right = [{ type = "zoom" }]
tab_bar_right_separator = " │ "

# A coloured dot for working, blocked and done, a ring for idle: symbols' half-filled
# working circle reads as a 9 at this size.
status_indicators = "dots"
[ui.toast]
delivery = "off"

# Every token here but state_icon, workspace and git_status comes from the sidebar local
# plugin. Colours are herdr's catppuccin palette, since token fg takes hex only.
#
# The agent panel is the inbox: pinned agents, then blocked, done and unread ones newest first.
# ✓ marks a reply not yet read (prefix+shift+m), which stays after a glance ends herdr's done.
# A title dims once its agent is idle and read; a project name takes its favicon's colour. The
# second row says why it waits: the question asked, or the reply's last line.
[ui.sidebar.agents]
row_gap = 0
rows = [
  [
    "state_icon", { token = "$unread", fg = "#a6e3a1" }, { token = "$title_active", fg = "#cdd6f4", bold = true }, "$title_idle",
    "$project_plain", { token = "$project_red", fg = "#f38ba8" }, { token = "$project_peach", fg = "#fab387" }, { token = "$project_green", fg = "#a6e3a1" }, { token = "$project_teal", fg = "#94e2d5" }, { token = "$project_blue", fg = "#89b4fa" }, { token = "$project_mauve", fg = "#cba6f7" },
  ],
  ["$reason"],
]

# Each space is a tree: its own row (its name, bold while focused; ticket; pull request),
# then a row per agent and per other checkout its panes are in, with that checkout's agents
# under it. The plugin writes each row's text with a state glyph (× blocked, ● working, ✓ done
# or unread, ○ idle), or "▸" on the row the focus is on, and a heavy ┕━ on the worktree the
# focus is in. The rules below pick its colour from those: the focused row and worktree mauve,
# blocked red, done green, working bright, idle grey. A pull request's
# number takes GitHub's colour for its state. A worktree space herdr nests under its repository,
# with a single agent, shows that agent's title on its own row instead: green while its reply is
# unread, bright while it works or waits, grey once idle. A blank line parts projects; herdr keeps
# a repository's linked-worktree spaces with it.
[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon", { token = "$name_focused", fg = "#cdd6f4", bold = true }, { token = "$name", fg = "#a6adc8" },
    { token = "$ticket", rules = [{ equals = "main", hide = true }, { equals = "master", hide = true }] },
    { token = "$lead_unread", fg = "#a6e3a1", bold = true }, { token = "$lead_active", fg = "#cdd6f4", bold = true }, "$lead_idle",
    { token = "$pr_open", fg = "#a6e3a1" }, "$pr_draft", { token = "$pr_merged", fg = "#cba6f7" }, { token = "$pr_closed", fg = "#f38ba8" }, "git_status",
  ],
  [{ token = "$row_1", rules = [{ contains = "▸", fg = "#cba6f7", bold = true }, { contains = "━ ", fg = "#cba6f7", bold = true }, { contains = "├─ ", fg = "#bac2de", bold = true }, { contains = "└─ ", fg = "#bac2de", bold = true }, { contains = "× ", fg = "#f38ba8", bold = true }, { contains = "✓ ", fg = "#a6e3a1", bold = true }, { contains = "● ", fg = "#cdd6f4", bold = true }] }, { token = "$row_1_pr_open", fg = "#a6e3a1" }, "$row_1_pr_draft", { token = "$row_1_pr_merged", fg = "#cba6f7" }, { token = "$row_1_pr_closed", fg = "#f38ba8" }],
  [{ token = "$row_2", rules = [{ contains = "▸", fg = "#cba6f7", bold = true }, { contains = "━ ", fg = "#cba6f7", bold = true }, { contains = "├─ ", fg = "#bac2de", bold = true }, { contains = "└─ ", fg = "#bac2de", bold = true }, { contains = "× ", fg = "#f38ba8", bold = true }, { contains = "✓ ", fg = "#a6e3a1", bold = true }, { contains = "● ", fg = "#cdd6f4", bold = true }] }, { token = "$row_2_pr_open", fg = "#a6e3a1" }, "$row_2_pr_draft", { token = "$row_2_pr_merged", fg = "#cba6f7" }, { token = "$row_2_pr_closed", fg = "#f38ba8" }],
  [{ token = "$row_3", rules = [{ contains = "▸", fg = "#cba6f7", bold = true }, { contains = "━ ", fg = "#cba6f7", bold = true }, { contains = "├─ ", fg = "#bac2de", bold = true }, { contains = "└─ ", fg = "#bac2de", bold = true }, { contains = "× ", fg = "#f38ba8", bold = true }, { contains = "✓ ", fg = "#a6e3a1", bold = true }, { contains = "● ", fg = "#cdd6f4", bold = true }] }, { token = "$row_3_pr_open", fg = "#a6e3a1" }, "$row_3_pr_draft", { token = "$row_3_pr_merged", fg = "#cba6f7" }, { token = "$row_3_pr_closed", fg = "#f38ba8" }],
  [{ token = "$row_4", rules = [{ contains = "▸", fg = "#cba6f7", bold = true }, { contains = "━ ", fg = "#cba6f7", bold = true }, { contains = "├─ ", fg = "#bac2de", bold = true }, { contains = "└─ ", fg = "#bac2de", bold = true }, { contains = "× ", fg = "#f38ba8", bold = true }, { contains = "✓ ", fg = "#a6e3a1", bold = true }, { contains = "● ", fg = "#cdd6f4", bold = true }] }, { token = "$row_4_pr_open", fg = "#a6e3a1" }, "$row_4_pr_draft", { token = "$row_4_pr_merged", fg = "#cba6f7" }, { token = "$row_4_pr_closed", fg = "#f38ba8" }],
  [{ token = "$row_5", rules = [{ contains = "▸", fg = "#cba6f7", bold = true }, { contains = "━ ", fg = "#cba6f7", bold = true }, { contains = "├─ ", fg = "#bac2de", bold = true }, { contains = "└─ ", fg = "#bac2de", bold = true }, { contains = "× ", fg = "#f38ba8", bold = true }, { contains = "✓ ", fg = "#a6e3a1", bold = true }, { contains = "● ", fg = "#cdd6f4", bold = true }] }, { token = "$row_5_pr_open", fg = "#a6e3a1" }, "$row_5_pr_draft", { token = "$row_5_pr_merged", fg = "#cba6f7" }, { token = "$row_5_pr_closed", fg = "#f38ba8" }],
  [{ token = "$row_6", rules = [{ contains = "▸", fg = "#cba6f7", bold = true }, { contains = "━ ", fg = "#cba6f7", bold = true }, { contains = "├─ ", fg = "#bac2de", bold = true }, { contains = "└─ ", fg = "#bac2de", bold = true }, { contains = "× ", fg = "#f38ba8", bold = true }, { contains = "✓ ", fg = "#a6e3a1", bold = true }, { contains = "● ", fg = "#cdd6f4", bold = true }] }, { token = "$row_6_pr_open", fg = "#a6e3a1" }, "$row_6_pr_draft", { token = "$row_6_pr_merged", fg = "#cba6f7" }, { token = "$row_6_pr_closed", fg = "#f38ba8" }],
  [{ token = "$row_7", rules = [{ contains = "▸", fg = "#cba6f7", bold = true }, { contains = "━ ", fg = "#cba6f7", bold = true }, { contains = "├─ ", fg = "#bac2de", bold = true }, { contains = "└─ ", fg = "#bac2de", bold = true }, { contains = "× ", fg = "#f38ba8", bold = true }, { contains = "✓ ", fg = "#a6e3a1", bold = true }, { contains = "● ", fg = "#cdd6f4", bold = true }] }, { token = "$row_7_pr_open", fg = "#a6e3a1" }, "$row_7_pr_draft", { token = "$row_7_pr_merged", fg = "#cba6f7" }, { token = "$row_7_pr_closed", fg = "#f38ba8" }],
  [{ token = "$row_8", rules = [{ contains = "▸", fg = "#cba6f7", bold = true }, { contains = "━ ", fg = "#cba6f7", bold = true }, { contains = "├─ ", fg = "#bac2de", bold = true }, { contains = "└─ ", fg = "#bac2de", bold = true }, { contains = "× ", fg = "#f38ba8", bold = true }, { contains = "✓ ", fg = "#a6e3a1", bold = true }, { contains = "● ", fg = "#cdd6f4", bold = true }] }, { token = "$row_8_pr_open", fg = "#a6e3a1" }, "$row_8_pr_draft", { token = "$row_8_pr_merged", fg = "#cba6f7" }, { token = "$row_8_pr_closed", fg = "#f38ba8" }],
  [{ token = "$row_9", rules = [{ contains = "▸", fg = "#cba6f7", bold = true }, { contains = "━ ", fg = "#cba6f7", bold = true }, { contains = "├─ ", fg = "#bac2de", bold = true }, { contains = "└─ ", fg = "#bac2de", bold = true }, { contains = "× ", fg = "#f38ba8", bold = true }, { contains = "✓ ", fg = "#a6e3a1", bold = true }, { contains = "● ", fg = "#cdd6f4", bold = true }] }, { token = "$row_9_pr_open", fg = "#a6e3a1" }, "$row_9_pr_draft", { token = "$row_9_pr_merged", fg = "#cba6f7" }, { token = "$row_9_pr_closed", fg = "#f38ba8" }],
  [{ token = "$row_10", rules = [{ contains = "▸", fg = "#cba6f7", bold = true }, { contains = "━ ", fg = "#cba6f7", bold = true }, { contains = "├─ ", fg = "#bac2de", bold = true }, { contains = "└─ ", fg = "#bac2de", bold = true }, { contains = "× ", fg = "#f38ba8", bold = true }, { contains = "✓ ", fg = "#a6e3a1", bold = true }, { contains = "● ", fg = "#cdd6f4", bold = true }] }, { token = "$row_10_pr_open", fg = "#a6e3a1" }, "$row_10_pr_draft", { token = "$row_10_pr_merged", fg = "#cba6f7" }, { token = "$row_10_pr_closed", fg = "#f38ba8" }],
  [{ token = "$row_11", rules = [{ contains = "▸", fg = "#cba6f7", bold = true }, { contains = "━ ", fg = "#cba6f7", bold = true }, { contains = "├─ ", fg = "#bac2de", bold = true }, { contains = "└─ ", fg = "#bac2de", bold = true }, { contains = "× ", fg = "#f38ba8", bold = true }, { contains = "✓ ", fg = "#a6e3a1", bold = true }, { contains = "● ", fg = "#cdd6f4", bold = true }] }, { token = "$row_11_pr_open", fg = "#a6e3a1" }, "$row_11_pr_draft", { token = "$row_11_pr_merged", fg = "#cba6f7" }, { token = "$row_11_pr_closed", fg = "#f38ba8" }],
  [{ token = "$row_12", rules = [{ contains = "▸", fg = "#cba6f7", bold = true }, { contains = "━ ", fg = "#cba6f7", bold = true }, { contains = "├─ ", fg = "#bac2de", bold = true }, { contains = "└─ ", fg = "#bac2de", bold = true }, { contains = "× ", fg = "#f38ba8", bold = true }, { contains = "✓ ", fg = "#a6e3a1", bold = true }, { contains = "● ", fg = "#cdd6f4", bold = true }] }, { token = "$row_12_pr_open", fg = "#a6e3a1" }, "$row_12_pr_draft", { token = "$row_12_pr_merged", fg = "#cba6f7" }, { token = "$row_12_pr_closed", fg = "#f38ba8" }],
  [{ token = "$row_13", rules = [{ contains = "▸", fg = "#cba6f7", bold = true }, { contains = "━ ", fg = "#cba6f7", bold = true }, { contains = "├─ ", fg = "#bac2de", bold = true }, { contains = "└─ ", fg = "#bac2de", bold = true }, { contains = "× ", fg = "#f38ba8", bold = true }, { contains = "✓ ", fg = "#a6e3a1", bold = true }, { contains = "● ", fg = "#cdd6f4", bold = true }] }, { token = "$row_13_pr_open", fg = "#a6e3a1" }, "$row_13_pr_draft", { token = "$row_13_pr_merged", fg = "#cba6f7" }, { token = "$row_13_pr_closed", fg = "#f38ba8" }],
  [{ token = "$row_14", rules = [{ contains = "▸", fg = "#cba6f7", bold = true }, { contains = "━ ", fg = "#cba6f7", bold = true }, { contains = "├─ ", fg = "#bac2de", bold = true }, { contains = "└─ ", fg = "#bac2de", bold = true }, { contains = "× ", fg = "#f38ba8", bold = true }, { contains = "✓ ", fg = "#a6e3a1", bold = true }, { contains = "● ", fg = "#cdd6f4", bold = true }] }, { token = "$row_14_pr_open", fg = "#a6e3a1" }, "$row_14_pr_draft", { token = "$row_14_pr_merged", fg = "#cba6f7" }, { token = "$row_14_pr_closed", fg = "#f38ba8" }],
  [{ token = "$row_15", rules = [{ contains = "▸", fg = "#cba6f7", bold = true }, { contains = "━ ", fg = "#cba6f7", bold = true }, { contains = "├─ ", fg = "#bac2de", bold = true }, { contains = "└─ ", fg = "#bac2de", bold = true }, { contains = "× ", fg = "#f38ba8", bold = true }, { contains = "✓ ", fg = "#a6e3a1", bold = true }, { contains = "● ", fg = "#cdd6f4", bold = true }] }, { token = "$row_15_pr_open", fg = "#a6e3a1" }, "$row_15_pr_draft", { token = "$row_15_pr_merged", fg = "#cba6f7" }, { token = "$row_15_pr_closed", fg = "#f38ba8" }],
]

# session.json already restores the workspace/tab/pane layout after a reboot;
# these two bring back what was inside the panes.
[session]
resume_agents_on_restore = true

[experimental]
pane_history = true

# Peon owns agent sounds and banners through herdr events.
[ui.sound]
enabled = false

[[keys.command]]
key = "prefix+alt+m"
type = "plugin_action"
command = "peon.mute"
description = "toggle agent sounds"
