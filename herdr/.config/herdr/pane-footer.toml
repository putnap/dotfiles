# Field layout for the tmux pane-border footer (footer/collect.sh --tmux).
enabled = true

# Available fields: access, mode, directory, branch, model, effort, context, tokens,
# five_hour, weekly, credits. "tokens" is what this Codex session spent, excluding
# cached reads. "credits" appears only once a usage window is exhausted.
# "mode" is Codex's collaboration mode and is shown only when it is not the default one.
# Remove a field to hide it; reorder or move it between sides. Missing data is omitted.
left = ["access", "mode", "directory", "branch"]
right = [["model", " ", "effort"], "context", "tokens", "five_hour", "weekly", "credits"]
# Outer items use this separator. Inner arrays concatenate tokens and literal text.
# Tokens retain their own colors; groups without available token data are omitted.
separator = " · "

context_label = "ctx"
five_hour_label = "5h"
weekly_label = "week"
tokens_label = "spent"
# Strictly above these percentages; 80% remains green and 95% remains amber.
warning_percent = 80
critical_percent = 95

# Theme palette names or literal #RGB / #RRGGBB colors.
# Palette names follow the active theme: red, green, yellow, blue, mauve,
# teal, peach, text, subtext0, surface0.
access_color = "yellow" # Fallback for a badge access_colors does not name.
mode_color = "teal"
directory_color = "green"
branch_color = "blue"
model_color = "mauve"
effort_color = "mauve"
usage_color = "green"
tokens_color = "subtext0"
credits_color = "peach" # Exhausted with no credits uses critical_color.
warning_color = "yellow"
critical_color = "red"
separator_color = "text"
background_color = "surface0"

# Each permission badge takes the colour its agent already shows for that mode.
# Keys are the badge text without brackets. This table must stay last: TOML reads
# every key after it as part of it.
[access_colors]
plan = "teal"
auto = "green"
"auto edits" = "green"
ask = "subtext0"
"read only" = "blue"
workspace = "yellow"
"full access" = "peach"
bypass = "red"
