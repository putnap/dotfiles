# An fzf picker over every running agent. next_agent (prefix+a) walks the panel
# blind; this shows what each one is doing before you land on it.
#
# Split from the `attention` plugin on purpose: attention.jump answers "who
# needs me" and runs fine without a tty, while this needs a real pty for fzf.
# Same division as worktree vs sessionizer.
id = "agents"
name = "Agent picker"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Pick an agent from an fzf list, with a live preview of its pane"
platforms = ["macos", "linux"]

# Actions run without a tty, so hand off to an overlay pane that has one.
[[actions]]
id = "pick"
title = "Pick an agent"
contexts = ["global"]
command = ["bash", "scripts/open-overlay.sh"]

[[panes]]
id = "picker"
title = "Agents"
placement = "overlay"
command = ["bash", "-c", "exec \"$HERDR_PLUGIN_ROOT/scripts/picker.sh\""]

# A tab whose process *is* claude. `herdr tab create` can only launch the shell,
# so a scripted "create tab, then run claude" shows the prompt and the typed
# command before claude paints; a plugin pane is launched as the pane's program.
[[actions]]
id = "new-tab"
title = "New agent tab"
contexts = ["workspace"]
command = ["bash", "scripts/open-agent.sh", "tab"]

[[actions]]
id = "new-pane"
title = "New agent pane"
contexts = ["workspace"]
command = ["bash", "scripts/open-agent.sh", "split"]

[[panes]]
id = "claude"
title = "claude"
placement = "tab"
command = ["claude", "--dangerously-skip-permissions"]

[[panes]]
id = "codex"
title = "codex"
placement = "tab"
command = ["codex"]

[[actions]]
id = "choose"
title = "Choose agent for a new tab"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "agents", "--entrypoint", "chooser", "--placement", "overlay", "--focus"]

[[panes]]
id = "chooser"
title = "Launch agent"
placement = "overlay"
command = ["bash", "scripts/choose-agent.sh"]
