# New tabs and panes running the default agent (plugins/config/agents/config.toml), and
# renaming a Claude session.
id = "agents"
name = "Agents"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "New tabs and panes that run the default agent, and renaming a Claude session"
platforms = ["macos", "linux"]

# A tab whose process *is* claude. `herdr tab create` can only launch the shell,
# so a scripted "create tab, then run claude" shows the prompt and the typed
# command before claude paints; a plugin pane is launched as the pane's program.
[[actions]]
id = "new-tab"
title = "New agent tab"
contexts = ["workspace"]
command = ["bash", "scripts/open-agent.sh", "tab"]

[[actions]]
id = "new-pane"
title = "New agent pane"
contexts = ["workspace"]
command = ["bash", "scripts/open-agent.sh", "split"]

[[panes]]
id = "claude"
title = "claude"
placement = "tab"
command = ["claude"]

[[panes]]
id = "codex"
title = "codex"
placement = "tab"
command = ["codex"]

# prefix+<, beside tmux's prefix+, for the tab: names the focused Claude session through its
# own /rename, which the pane's title follows, in a popup drawn like herdr's rename dialog.
[[actions]]
id = "rename"
title = "Rename the Claude session"
contexts = ["global"]
command = ["bash", "scripts/open-rename.sh"]

[[panes]]
id = "rename"
title = "rename session · empty: Claude names it"
placement = "popup"
width = 56
height = 6
command = ["bash", "-c", "exec \"$HERDR_PLUGIN_ROOT/scripts/rename-session.sh\""]
