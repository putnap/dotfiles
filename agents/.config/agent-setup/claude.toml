cleanupPeriodDays = 120
model = "claude-fable-5-1[1m]"
outputStyle = "Concise"
feedbackDrafts = "off"
effortLevel = "high"
tui = "fullscreen"
theme = "custom:catppuccin-mocha"
preferredNotifChannel = "notifications_disabled"
remoteControlAtStartup = true
voiceEnabled = true
notify_claude_update = false

[env]
DISABLE_AUTOUPDATER = "1"
# TokenEconomizer learns from each repository's earlier sessions too, with no model call.
TE_HISTORY_IMPORT = "on"

[statusLine]
type = "command"
command = "bash ~/.claude/statusline-command.sh"

[enabledPlugins]
"frontend-design@claude-plugins-official" = true
"rust-analyzer-lsp@claude-plugins-official" = true
"swift-lsp@claude-plugins-official" = true
"tokeneconomizer@tokeneconomizer" = true

[extraKnownMarketplaces.tokeneconomizer.source]
source = "github"
repo = "microsoft/TokenEconomizer"

[voice]
enabled = true
mode = "hold"
