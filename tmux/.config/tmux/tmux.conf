set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins"
# Tmux is standalone; inherited herdr identities must not reach new agents.
set-environment -gu HERDR_SOCKET_PATH
set-environment -gu HERDR_PANE_ID
set-environment -gu HERDR_TAB_ID
set-environment -gu HERDR_WORKSPACE_ID
set-environment -gu HERDR_ENV

set-option -sa terminal-overrides ",xterm*:Tc"
# Shift+Enter = newline in Claude Code (disambiguated modified keys).
# Keep both lines; allow-passthrough below is a DIFFERENT feature (DCS) and must not replace them.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g allow-passthrough on
set -g mouse on

unbind C-b
set -g prefix C-\\
bind C-\\ send-prefix

unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Vertical arrows switch sessions, matching herdr workspaces.
bind -n S-Up switch-client -p
bind -n S-Down switch-client -n

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'mrjones2014/smart-splits.nvim#v2.1.1-final' # v3 moved tmux support to a separate backend
# set -g @plugin "janoamaral/tokyo-night-tmux"
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'alexwforsythe/tmux-which-key' # prefix + space

# sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'
# persistence.nvim restores from its state directory when nvim starts without files.
set -g @resurrect-processes '"~nvim->nvim" claude codex "workmux _sidebar-run"'
set -gu @resurrect-strategy-nvim
set -g @resurrect-hook-post-save-layout 'bash ~/.config/tmux/scripts/workmux.sh save'
set -g @resurrect-hook-pre-restore-all 'tmux set-option -g @workmux_restoring on'
set -g @resurrect-hook-post-restore-all 'bash ~/.config/tmux/scripts/workmux.sh finish-restore'
set -g @resurrect-hook-pre-restore-pane-processes 'bash ~/.config/tmux/scripts/workmux.sh restore-sidebars'
set -g @resurrect-capture-pane-contents 'on'

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '-' split-window -v -c "#{pane_current_path}"
bind '|' split-window -h -c "#{pane_current_path}"

# Fork the AI session in the current pane into a new pane / window
bind f run-shell "~/.config/tmux/scripts/agent-fork.sh pane #{pane_id}"
bind F run-shell "~/.config/tmux/scripts/agent-fork.sh window #{pane_id}"

bind s display-popup -E -T "Sessions" -h 60% -w 80% "tms switch"
bind g display-popup -E -T "Lazygit" -d "#{pane_current_path}" -w 80% -h 80% lazygit
bind w display-popup -E -T "Windows" -h 60% -w 80% "tms windows"
bind 'C-o' display-popup -E -T 'Tmux Sessionizer' 'tms'

# Configure navigation. smart-splits also drives the herdr side, so nvim keeps
# one set of nav/resize keys across both multiplexers.
set -g @smart-splits_no_wrap 'on'
set -g @smart-splits_resize_left_key 'C-S-Left'
set -g @smart-splits_resize_down_key 'C-S-Down'
set -g @smart-splits_resize_up_key 'C-S-Up'
set -g @smart-splits_resize_right_key 'C-S-Right'
set -g @smart-splits_resize_step_size '5'

# set -g @tokyo-night-tmux_show_git 0
# set -g @tokyo-night-tmux_show_datetime 0
# set -g @tokyo-night-tmux_window_id_style hsquare
# set -g @tokyo-night-tmux_transparent 1

# Configure Catppuccin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

# Configure Online
set -g @online_icon "ok"
set -g @offline_icon "nok"

# status left look and feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S },#{#[bg=#{@thm_bg},fg=#{@thm_green}]  #S }}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_maroon}]  #{pane_current_command} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

# status right look and feel
set -g status-right-length 100
set -g status-right ""
# set -ga status-right "#{?#{e|>=:10,#{battery_percentage}},#{#[bg=#{@thm_red},fg=#{@thm_bg}]},#{#[bg=#{@thm_bg},fg=#{@thm_pink}]}} #{battery_icon} #{battery_percentage} "
# set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│"
# set -ga status-right "#[bg=#{@thm_bg}]#{?#{==:#{online_status},ok},#[fg=#{@thm_mauve}] 󰖩 on ,#[fg=#{@thm_red},bold]#[reverse] 󰖪 off }"
# set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│"
# set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_blue}] 󰭦 %Y-%m-%d 󰅐 %H:%M "

set -g status-position top
set -g status-style "bg=#{@thm_bg}"
set -g status-justify "absolute-centre"

# pane border look and feel
setw -g pane-border-status bottom
setw -g pane-border-format '#{E:@footer}'
setw -g pane-active-border-style "bg=#{@thm_bg},fg=#{@thm_overlay_0}"
setw -g pane-border-style "bg=#{@thm_bg},fg=#{@thm_surface_0}"
setw -g pane-border-lines single

# window look and feel
set -g visual-activity off
set -g monitor-activity off
set -wg automatic-rename on
set -g automatic-rename-format "Window"

set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,}#{?@workmux_status, #{@workmux_status},} "
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_rosewater}"
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_peach}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"

set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,}#{?@workmux_status, #{@workmux_status},} "
set -g window-status-current-style "bg=#{@thm_peach},fg=#{@thm_bg},bold"

# install TPM if it's not installe and run plugin instalation script
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '$TMUX_PLUGIN_MANAGER_PATH/tpm/tpm'

# Run after plugins so their defaults cannot replace the agent bindings/footer.
bind \\ split-window -h -c "#{pane_current_path}"
setw -g pane-border-status bottom
setw -g pane-border-format '#{E:@footer}'
bind -n C-S-\\ split-window -h -c "#{pane_current_path}"
bind -n C-S-_ split-window -v -c "#{pane_current_path}"
# Ghostty encodes shifted punctuation differently in CSI-u and modifyOtherKeys.
bind -n C-S-| split-window -h -c "#{pane_current_path}"
bind -n C-| split-window -h -c "#{pane_current_path}"
bind -n C-S-- split-window -v -c "#{pane_current_path}"
bind -n C-_ split-window -v -c "#{pane_current_path}"
bind -n C-S-W confirm-before -p "Kill pane? (y/n)" kill-pane
bind -n C-S-+ break-pane
bind -n C-S-H run-shell 'workmux sidebar --session'
bind -n C-S-I run-shell 'workmux last-done'
bind a display-popup -E -T 'Agents' -d "#{pane_current_path}" -w 90% -h 90% 'workmux dashboard'
bind j run-shell 'workmux sidebar next'
bind k run-shell 'workmux sidebar prev'
bind h display-popup -E -T 'GitHub Dashboard' -d "#{pane_current_path}" -w 80% -h 80% gh-dash
bind G display-popup -E -T 'New worktree' -d "#{pane_current_path}" -w 80% -h 60% 'bash ~/.config/tmux/scripts/workmux.sh new'
bind C-g display-popup -E -T 'Open worktree' -d "#{pane_current_path}" -w 80% -h 60% 'bash ~/.config/tmux/scripts/workmux.sh open'
bind C run-shell -c "#{pane_current_path}" 'bash ~/.config/tmux/scripts/workmux.sh launch window'
bind -n C-S-C run-shell -c "#{pane_current_path}" 'bash ~/.config/tmux/scripts/workmux.sh launch pane'
bind M-c display-popup -E -T 'Choose agent' -d "#{pane_current_path}" 'bash ~/.config/tmux/scripts/workmux.sh choose window'
bind M-m run-shell 'bash /opt/homebrew/opt/peon-ping/libexec/peon.sh toggle'
bind Tab select-pane -t :.+
bind T command-prompt -I '#W' 'rename-window "%%"'
bind W command-prompt -I '#S' 'rename-session "%%"'
bind X confirm-before -p 'Kill window? (y/n)' kill-window
bind K swap-pane -U
bind J swap-pane -D
bind C-r display-popup -E -T 'Restore worktree agents' -d "#{pane_current_path}" 'workmux resurrect'
set-hook -g 'client-attached[90]' 'run-shell -b "bash ~/.config/tmux/scripts/workmux.sh start"'
run-shell -b 'bash ~/.config/tmux/scripts/workmux.sh start'
bind M-1 run-shell 'workmux sidebar jump 1'
bind M-2 run-shell 'workmux sidebar jump 2'
bind M-3 run-shell 'workmux sidebar jump 3'
bind M-4 run-shell 'workmux sidebar jump 4'
bind M-5 run-shell 'workmux sidebar jump 5'
bind M-6 run-shell 'workmux sidebar jump 6'
bind M-7 run-shell 'workmux sidebar jump 7'
bind M-8 run-shell 'workmux sidebar jump 8'
bind M-9 run-shell 'workmux sidebar jump 9'
